# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# default_language_version:
#   python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: |
          (?x)(.devcontainer/)
      - id: check-merge-conflict
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        name: Check Python code (black auto-format)
  # - repo: https://github.com/PyCQA/flake8.git
  #   rev: 6.0.0
  #   hooks:
  #     - id: flake8
  #       # E203 - whitespace before ':' (Black and Flake8 disagree on this one - Black wins)
  #       # E501 - line lengths are controlled by Black
  #       # E266 - Flake8 forbids comments with double pound-sign
  #       # W503 - Flake8 (knowingly) breaks with Black and Pep8
  #       # E731 - Allow lambda functions to be assigned to variables
  #       # E712 - comparison to True should be 'if cond is True:' or 'if cond:'
  #       #        This is a bad and old fashioned practice.
  #       # Max complexity relates to cyclomatic complexity and the flake8 error code is C901
  #       args: ["--ignore=E203,E501,E266,W503,E712,E731", "--max-complexity=6"]
  #       name: Check Python code (flake8 linting)
  #       exclude: |
  #         (?x)(
  #             settings/(base|production|dev|test).py|
  #             tests/|
  #             migrations/|
  #             scripts/
  #         )
  - repo: https://github.com/python-poetry/poetry
    rev: '2.2.0'
    hooks:
      - id: poetry-check
  - repo: https://github.com/python-poetry/poetry-plugin-export
    rev: '1.9.0'
    hooks:
      - id: poetry-export
        args: ["--with", "dev", "-f", "requirements.txt", "-o", "requirements.txt"]
