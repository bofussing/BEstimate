#   JOBS   #
############

build:
  stage: build
  extends:
    - .template-wo-script-or-rules
    - .specific-variables
    - .component-rules-except-release
    - .component-script_docker-build
  

unit-test:
  stage: test
  extends:
    - .template-wo-script-or-rules
    - .specific-variables
    - .component-rules-except-release
    - .component-script-test-unit-python
  

e2e-test:
  stage: test
  extends:
